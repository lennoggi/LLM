name: CI

on:
    push:
    pull_request:

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout the repository
              uses: actions/checkout@v4
            - name: Install BLAS
              run:  |-
                    sudo apt update
                    sudo apt install -y libopenblas-dev liblapack-dev
            - name: Compile and run the code
              run:  ./build_and_run.sh
